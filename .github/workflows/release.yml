name: release
on: { push: { tags: ["v*"] } }
permissions: { contents: read, id-token: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", registry-url: "https://registry.npmjs.org" }
      # Trusted Publishing (OIDC): npm CLI 11.5.1+ exchanges the GitHub Actions identity for a one-time publish
      # token — no NPM_TOKEN secret. The trusted publisher is configured on the package page on npmjs.com.
      - run: npm install -g npm@^11.5.1
      - run: npm ci && npm test
      - name: tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
